name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath 4k-yt-downloader-extension.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer_output/YTDownloaderHelper-Setup.exe
            4k-yt-downloader-extension.zip
